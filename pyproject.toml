[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trixdb"
version = "0.6.0"
description = "Official Python SDK for Trix - Memory and Knowledge Management API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Trix Team", email = "support@trixdb.com" }
]
keywords = ["trix", "memory", "knowledge", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "respx>=0.20.0",
    "pip-audit>=2.6.0",
]
telemetry = [
    "opentelemetry-api>=1.0.0",
]

[project.urls]
Homepage = "https://trixdb.com"
Documentation = "https://docs.trixdb.com"
Repository = "https://github.com/trixdb/trix-sdk-python"
Issues = "https://github.com/trixdb/trix-sdk-python/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the PEP 561 marker so downstream type checkers treat trix as typed.
trix = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Pin an explicit ruleset. Without `select`, ruff applies its full default
# rule set, which grows every release (0.16.2 ships 413 rules) and flagged
# 4362 errors here (mostly FA100/UP006), breaking the release quality gate.
# Mirrors trix-sdk-python-examples, which is green with this same selection.
select = ["E", "F", "I", "W"]
# black owns formatting/line length (both tools are set to 100). black does
# not wrap long docstrings/strings, so E501 would conflict with the formatter
# on lines it deliberately leaves long; defer line-length enforcement to black.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Intentional re-export shims: star imports (F401/F403) keep the public type
# surface in lockstep with trix.types; a couple import after module code (E402).
"src/trix/types/__init__.py" = ["F401", "E402"]
"src/trix/resources/__init__.py" = ["F401"]
"src/trix/_type_exports.py" = ["F403"]
"src/trix/resources/github_types.py" = ["E402"]
# github resource consumes its return-type models from a github_types star import.
"src/trix/resources/github.py" = ["F405"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

# These modules are backward-compatible re-export facades. trix.types aggregates
# names from many submodules and builds __all__ by concatenating imported list
# variables (which mypy cannot evaluate statically); trix.utils.security and
# trix.utils.telemetry re-import a few names from sibling modules. Treat their
# imported names as re-exported so `from trix.<mod> import X` type-checks under
# strict no_implicit_reexport.
[[tool.mypy.overrides]]
module = ["trix.types", "trix.utils.security", "trix.utils.telemetry"]
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
